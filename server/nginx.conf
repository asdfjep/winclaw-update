server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # WinClaw in-app auto-update distribution.
    # Serves winclaw-update.json + Hs-WinClaw-Setup-*.exe from the volume
    # mounted at /data/winclaw-update (see docker-compose.update.yml).
    # Manifest must not be cached, or clients keep seeing stale versions.
    location /update/ {
        alias /data/winclaw-update/;
        add_header Cache-Control "no-cache";
        autoindex off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}