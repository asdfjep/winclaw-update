# WinClaw 独立更新栈 —— 8091 唯一对外入口（与知识库 hs-rag 无耦合）：
# /update/ 从命名卷提供更新包静态文件；其余路径代理到管理端（UI + API）。
server {
    listen 80;
    server_name _;

    # 管理端上传安装包约 140MB+，上限放宽到 1G
    client_max_body_size 1g;

    # WinClaw in-app auto-update distribution.
    # Serves winclaw-update.json + Hs-WinClaw-Setup-*.exe from the volume
    # mounted at /data/winclaw-update (see docker-compose.update.yml).
    # Manifest must not be cached, or clients keep seeing stale versions.
    location /update/ {
        alias /data/winclaw-update/;
        add_header Cache-Control "no-cache";
        autoindex off;
    }

    # 管理端（update-admin 服务，同 compose 默认网络）：UI + /api/*
    location / {
        proxy_pass http://update-admin:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传留足时间
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
