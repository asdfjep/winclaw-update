# WinClaw 独立更新栈 —— 8091 唯一对外入口（与知识库 hs-rag 无耦合）：
# /update/ 从命名卷提供更新包静态文件；其余路径代理到管理端（UI + API）。
server {
    listen 80;
    server_name _;

    # 与 Node 单包上限一致；完整 EXE 以流方式上传。
    client_max_body_size 2g;

    location = /update/winclaw2/latest.yml {
        proxy_pass http://update-admin:8091;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location /update/winclaw2/releases/ {
        alias /data/winclaw-update/public/winclaw2/releases/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        autoindex off;
    }

    location /update/ { return 404; }

    location /api/v2/uploads/ {
        proxy_pass http://update-admin:8091;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 管理端（update-admin 服务，同 compose 默认网络）：UI + /api/*
    location / {
        proxy_pass http://update-admin:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传留足时间
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
