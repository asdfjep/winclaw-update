# WinClaw 独立更新栈 —— 8080 唯一对外入口：
# /update/ 从命名卷提供更新包静态文件；其余路径代理到 hs-rag 容器
#（知识库 Web 登录/API）。两个 upstream 的服务名来自 hs-rag compose
# 的 default 网络（hs-rag_default），见 docker-compose.update.yml。
upstream backend {
    server backend:5000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # hs-rag 后端上传上限
    client_max_body_size 50m;

    # WinClaw in-app auto-update distribution.
    # Serves winclaw-update.json + Hs-WinClaw-Setup-*.exe from the volume
    # mounted at /data/winclaw-update (see docker-compose.update.yml).
    # Manifest must not be cached, or clients keep seeing stale versions.
    location /update/ {
        alias /data/winclaw-update/;
        add_header Cache-Control "no-cache";
        autoindex off;
    }

    # hs-rag API -> .NET backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for chat-stream endpoint
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Next.js static assets
    location /_next/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js frontend (知识库 Web 登录)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
