# WinClaw 自动更新分发 —— 独立部署栈（与知识库 hs-rag 完全解耦）
# 对外唯一端口 8091：/update/ 静态分发更新包；/ 代理到管理端（前端+API 同址）。
# 单一命名卷 winclaw-update 同时给 nginx(:ro) 提供更新包、给 update-admin(:rw) 管理。
# 注意：snap-Docker 下命名卷带项目前缀！本项目名为 "server"，卷实际叫
# server_winclaw-update；旧 hs-rag 项目的卷叫 hs-rag_winclaw-update，数据不互通。
#
# 离线构建要求：服务器无法访问外网时，admin 构建零依赖（仅 COPY），
# 根镜像 node:22-alpine / nginx:alpine 需已在本地镜像缓存。

services:
  update-admin:
    build:
      context: ../admin
    container_name: hsrag-update-admin
    # 不对外暴露端口：管理端 UI/API 统一经 nginx 8091 代理
    volumes:
      - winclaw-update:/data/winclaw-update:rw
    environment:
      - WINCLAW_UPDATE_BASE_URL=http://10.233.129.67:8091/update   # 写进清单的 url 前缀（8091）
      - WINCLAW_UPDATE_DIR=/data/winclaw-update
      - WINCLAW_ADMIN_PORT=8091
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: hsrag-update-nginx
    ports:
      - "8091:80"
    volumes:
      - winclaw-update:/data/winclaw-update:ro
    depends_on:
      - update-admin
    restart: unless-stopped

# 顶层命名卷显式固定名字：复用已存在的 server_winclaw-update 数据卷
#（snap-Docker 下不带 name 会因项目名前缀生成空卷 → nginx /update 404）。
volumes:
  winclaw-update:
    name: server_winclaw-update
