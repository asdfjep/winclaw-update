<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WinClaw2 更新管理</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div><h1>WinClaw2 更新管理</h1><p>完整 Windows x64 安装包 · 正式与预览独立发布</p></div>
  </header>
  <main>
    <div id="workspace">
      <section class="card">
        <h2>上传完整安装包</h2>
        <p>选择同一次打包生成的 <code>release.json</code> 和完整 <code>HoardSunAI-版本-win-x64.exe</code>。历史 <code>WinClaw-版本-win-x64.exe</code> 仍受支持。上传并校验后仍需明确发布。</p>
        <div class="inputs"><label>发布元数据 <input id="release-file" type="file" accept=".json"></label><label>完整安装包 <input id="installer-file" type="file" accept=".exe"></label></div>
        <button id="upload">上传并校验</button>
        <progress id="upload-progress" max="100" value="0" hidden></progress>
        <span id="upload-status"></span>
      </section>
      <section class="channels">
        <article class="card"><h2>预览通道</h2><div id="preview-current"></div><button id="preview-restore">撤回到上一版本</button></article>
        <article class="card"><h2>正式通道</h2><div id="stable-current"></div><button id="stable-restore">撤回到上一版本</button></article>
      </section>
      <section class="card">
        <div class="title-row"><h2>已校验版本</h2><button id="refresh">刷新</button></div>
        <p class="hint">预览和正式引用同一个不可变安装包。撤回只阻止后续升级，不会降低已安装版本。</p>
        <div class="table-scroll"><table><thead><tr><th>版本</th><th>大小 / SHA512</th><th>构建</th><th>状态</th><th>操作</th></tr></thead><tbody id="releases"></tbody></table></div>
      </section>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
